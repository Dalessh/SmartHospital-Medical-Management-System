<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartHospital</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-theme="light">
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-hospital-alt"></i>
                <span>SmartHospital</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="login.html" class="nav-link btn-login active">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="login-section">
        <div class="login-container">
            <div class="login-card glass-card">
                <div class="login-header">
                    <i class="fas fa-hospital-alt"></i>
                    <h2>Welcome Back</h2>
                    <p>Login to your SmartHospital account</p>
                </div>
                
                <div class="login-error" id="loginError" style="display: none;"></div>
                
                <form id="hospitalLoginForm">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        Login <i class="fas fa-sign-in-alt"></i>
                    </button>
                </form>
                
                <div class="login-demo">
                    <h4>Demo Credentials</h4>
                    <div class="demo-credentials">
                        <div class="demo-item">
                            <strong>Admin:</strong> admin / admin123
                        </div>
                        <div class="demo-item">
                            <strong>Doctor:</strong> doctor / doctor123
                        </div>
                        <div class="demo-item">
                            <strong>Patient:</strong> patient / patient123
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
